version: 1
# Gen 2 build spec — only on claude/gen2-deployment branch (Amplify app
# dr03gq88jj3a1 / botchat-gen2). The existing Gen 1 hosting app's dev/main
# branches use the original amplify.yml until cutover (PR 4 of the
# migration). See ClickUp 86b9qh888.
backend:
  phases:
    build:
      commands:
        # `npm ci`, never `npm install` — see aws-amplify/amplify-backend#3158
        # (npm install mutates the lockfile to a state where npm ci then errors).
        - npm ci --cache .npm --prefer-offline
        # Deploys the Gen 2 backend defined in amplify/backend.ts. The
        # AWS_BRANCH and AWS_APP_ID env vars are auto-injected by Amplify
        # Hosting. Generates amplify_outputs.json on success.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - npm ci
        - node scripts/sync-lambda-graphql.js
        - |
          git diff --exit-code amplify/backend/function/botchattriggerjs/src/graphql.js || (echo "ERROR: graphql.js is out of sync with src/graphql/. Run 'npm run sync-lambda-graphql' and commit the result." && exit 1)
        - node scripts/generate-amplify-config.js
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
test:
  phases:
    preTest:
      commands:
        - nvm use 24
        - mkdir -p $HOME/bin && curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b $HOME/bin
        - $HOME/bin/trufflehog git file://. --only-verified --fail
        - npm ci --cache .npm --prefer-offline
        - npm install -g wait-on
        - npm install -g pm2
        # Playwright runs in a separate Docker container with its own
        # Node + browser binaries. We need Docker daemon running here.
        - sudo dnf install -y docker
        - sudo dockerd &
        - wait-on -t 15000 file:/var/run/docker.sock
        # Start Next.js prod server backed by the just-built artifacts.
        # Playwright will hit it on localhost:3000.
        - npx pm2 start npm -- start
        - wait-on http://localhost:3000
    test:
      commands:
        - npm run check:no-skip
        - npm test
        - ls -la reports
        # Run the Playwright e2e suite (login, chat-flow). The Lambda the
        # tests exercise is whichever ampx pipeline-deploy just published,
        # so this gates every push on real end-to-end behavior.
        - sudo docker run --add-host=hostmachine:host-gateway --network=host --rm --init -v $(pwd):/home/pwuser -e TEST_USER_EMAIL="$TEST_USER_EMAIL" -e TEST_USER_PASSWORD="$TEST_USER_PASSWORD" -e CI=true mcr.microsoft.com/playwright:v1.59.1-jammy /bin/sh -c "cd /home/pwuser && npm install @playwright/test@1.59.1 && npx playwright install && npx playwright test --grep-invert 'gen2-validation'"
        - ls -la reports
    postTest:
      commands:
        - npx pm2 kill
  artifacts:
    baseDirectory: 'reports'
    files:
      - '**/*'
